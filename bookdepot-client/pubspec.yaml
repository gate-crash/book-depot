name: bookdepot_client
description: "Client application for Bookdepot, a personal library management tool."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2


  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1 # Use the latest version available


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/bookcase.png
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  
  # Adaptive icon configuration for Android 8.0+
  adaptive_icon_background: "#FFFFFF" # Or an image path like "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png" 